      - name: Check Lambda permissions
        run: |
          echo "===== LAMBDA POLICY ====="

          aws lambda get-policy \
            --function-name nslookupv2 || true

          echo "===== FUNCTION URL ====="

          aws lambda get-function-url-config \
            --function-name nslookupv2 || true


      - name: Try Lambda invocation
        run: |
          echo "===== INVOKE LAMBDA ====="

          aws lambda invoke \
            --function-name nslookupv2 \
            --payload '{"domain":"example.com"}' \
            lambda-response.json || true

          cat lambda-response.json || true


      - name: Download Lambda code
        run: |
          echo "===== DOWNLOAD LAMBDA PACKAGE ====="

          URL=$(aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Code.Location' \
            --output text)

          wget "$URL" -O lambda.zip

          echo "===== ZIP CONTENT ====="

          unzip -l lambda.zip
