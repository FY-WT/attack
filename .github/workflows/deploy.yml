name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Describe VPC
        run: |
          echo "===== VPC ====="
          aws ec2 describe-vpcs --vpc-ids vpc-09328d3fa21dce320

      - name: Get Lambda code location
        run: |
          echo "===== LAMBDA CODE LOCATION ====="
          aws lambda get-function --function-name nslookupv2 --query 'Code.Location' --output text

      - name: Download code.zip via presigned URL
        run: |
          URL=$(aws lambda get-function --function-name nslookupv2 --query 'Code.Location' --output text)
          curl -sL "$URL" -o code.zip

      - name: Download code.zip directly from S3 (fallback)
        continue-on-error: true
        run: |
          aws s3 cp s3://codec4f26c862a321ef5/code.zip ./code_s3.zip

      - name: Unzip and show handler
        run: |
          mkdir -p extracted
          unzip -o code.zip -d extracted || unzip -o code_s3.zip -d extracted
          echo "===== FILES ====="
          find extracted -type f
          echo "===== lambda_function.py ====="
          cat extracted/lambda_function.py || true
