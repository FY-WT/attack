name: deploy

on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: |
          aws sts get-caller-identity

      - name: Check S3 bucket
        run: |
          echo "===== S3 CONTENT ====="
          aws s3 ls s3://codec4f26c862a321ef5/

      - name: Read loot file
        run: |
          echo "===== LOOT CONTENT ====="
          aws s3 cp s3://codec4f26c862a321ef5/loot.txt - || true

      - name: Lambda information
        run: |
          echo "===== LAMBDA CONFIG ====="
          aws lambda get-function-configuration \
            --function-name nslookupv2

      - name: Test API
        run: |
          echo "===== API TEST ====="

          curl -i -X POST \
          https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
          -H "Content-Type: application/json" \
          -d '{"domain":"example.com"}'
