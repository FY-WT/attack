name: deploy

on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: |
          echo "===== IDENTITY ====="
          aws sts get-caller-identity

      - name: Lambda information
        run: |
          echo "===== LAMBDA CONFIG ====="

          aws lambda get-function-configuration \
            --function-name nslookupv2

          echo "===== LAMBDA POLICY ====="

          aws lambda get-policy \
            --function-name nslookupv2 || true

      - name: Lambda tags
        run: |
          echo "===== LAMBDA TAGS ====="

          aws lambda list-tags \
          --resource arn:aws:lambda:us-east-1:009661764077:function:nslookupv2 || true

      - name: S3 information
        run: |
          echo "===== BUCKETS ====="

          aws s3 ls

          for bucket in $(aws s3 ls | awk '{print $3}')
          do
            echo "===== BUCKET POLICY $bucket ====="
            aws s3api get-bucket-policy \
              --bucket $bucket || true

            echo "===== BUCKET ACL $bucket ====="
            aws s3api get-bucket-acl \
              --bucket $bucket || true
          done

      - name: CloudWatch logs
        run: |
          echo "===== LOG GROUPS ====="

          aws logs describe-log-groups || true

          echo "===== LAMBDA LOGS ====="

          aws logs describe-log-streams \
            --log-group-name /aws/lambda/nslookupv2 || true

      - name: IAM role information
        run: |
          echo "===== CICD ROLE ====="

          aws iam get-role \
            --role-name cicdRole || true

      - name: API Gateway attempts
        run: |
          echo "===== API GATEWAY ====="

          aws apigateway get-rest-apis || true

          echo "===== API STAGES ====="

          aws apigateway get-stages \
            --rest-api-id 3q931syi7b || true
