name: deploy

on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1


      - name: AWS identity
        run: |
          echo "===== AWS IDENTITY ====="
          aws sts get-caller-identity


      - name: API Gateway enumeration
        run: |
          echo "===== REST APIs ====="

          aws apigateway get-rest-apis


      - name: API Gateway resources
        run: |
          echo "===== RESOURCES ====="

          aws apigateway get-resources \
            --rest-api-id 3q931syi7b


      - name: API Gateway stages
        run: |
          echo "===== STAGES ====="

          aws apigateway get-stages \
            --rest-api-id 3q931syi7b


      - name: Lambda trigger check
        run: |
          echo "===== LAMBDA POLICY ====="

          aws lambda get-policy \
            --function-name nslookupv2
