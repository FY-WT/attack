name: deploy
on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: cicdRole - attached managed policies
        continue-on-error: true
        run: |
          echo "===== cicdRole ATTACHED POLICIES ====="
          aws iam list-attached-role-policies --role-name cicdRole

      - name: cicdRole - inline policies
        continue-on-error: true
        run: |
          echo "===== cicdRole INLINE POLICY NAMES ====="
          aws iam list-role-policies --role-name cicdRole
          for POLICY in $(aws iam list-role-policies --role-name cicdRole --query 'PolicyNames[]' --output text); do
            echo "----- $POLICY -----"
            aws iam get-role-policy --role-name cicdRole --policy-name "$POLICY"
          done

      - name: cicdRole - trust policy
        continue-on-error: true
        run: |
          echo "===== cicdRole TRUST POLICY ====="
          aws iam get-role --role-name cicdRole --query 'Role.AssumeRolePolicyDocument'

      - name: CTFExecutionRole - trust policy (who can assume it)
        continue-on-error: true
        run: |
          echo "===== CTFExecutionRole TRUST POLICY ====="
          aws iam get-role --role-name CTFExecutionRole --query 'Role.AssumeRolePolicyDocument'

      - name: CTFExecutionRole - attached and inline policies
        continue-on-error: true
        run: |
          echo "===== CTFExecutionRole ATTACHED POLICIES ====="
          aws iam list-attached-role-policies --role-name CTFExecutionRole
          echo "===== CTFExecutionRole INLINE POLICIES ====="
          aws iam list-role-policies --role-name CTFExecutionRole
          for POLICY in $(aws iam list-role-policies --role-name CTFExecutionRole --query 'PolicyNames[]' --output text); do
            echo "----- $POLICY -----"
            aws iam get-role-policy --role-name CTFExecutionRole --policy-name "$POLICY"
          done

      - name: lambdaRole - trust policy and policies
        continue-on-error: true
        run: |
          echo "===== lambdaRole TRUST POLICY ====="
          aws iam get-role --role-name lambdaRole --query 'Role.AssumeRolePolicyDocument'
          echo "===== lambdaRole ATTACHED POLICIES ====="
          aws iam list-attached-role-policies --role-name lambdaRole
          echo "===== lambdaRole INLINE POLICIES ====="
          aws iam list-role-policies --role-name lambdaRole

      - name: Check for Lambda Function URL
        continue-on-error: true
        run: |
          echo "===== FUNCTION URL CONFIG ====="
          aws lambda get-function-url-config --function-name nslookupv2

      - name: Check resource-based policy on the Lambda itself
        continue-on-error: true
        run: |
          echo "===== LAMBDA RESOURCE POLICY ====="
          aws lambda get-policy --function-name nslookupv2

      - name: Check event source mappings
        continue-on-error: true
        run: |
          echo "===== EVENT SOURCE MAPPINGS ====="
          aws lambda list-event-source-mappings --function-name nslookupv2

      - name: Check EventBridge rules targeting this Lambda
        continue-on-error: true
        run: |
          echo "===== EVENTBRIDGE RULES TARGETING nslookupv2 ====="
          aws events list-rule-names-by-target \
            --target-arn arn:aws:lambda:us-east-1:009661764077:function:nslookupv2

      - name: Check API Gateway REST APIs
        continue-on-error: true
        run: |
          echo "===== API GATEWAY (REST) ====="
          aws apigateway get-rest-apis

      - name: Check API Gateway HTTP APIs (v2)
        continue-on-error: true
        run: |
          echo "===== API GATEWAY (HTTP/v2) ====="
          aws apigatewayv2 get-apis

      - name: Check S3 bucket notification configs (possible S3-triggered invocation)
        continue-on-error: true
        run: |
          echo "===== S3 BUCKET NOTIFICATION CONFIG ====="
          for BUCKET in codec4f26c862a321ef5 platform-bucket-009661764077-us-east-1 site781fe43f26b9eba3; do
            echo "----- $BUCKET -----"
            aws s3api get-bucket-notification-configuration --bucket "$BUCKET"
          done
